<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>베르누이 날개 실험실</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: linear-gradient(180deg, #fff8e7 0%, #fef1d6 100%);
    color: #4a3623;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 1.6em;
    margin-bottom: 4px;
    color: #b25c1e;
  }
  p.sub {
    text-align: center;
    margin-top: 0;
    color: #8a6a45;
    font-size: 0.95em;
  }
  .card {
    background: #fffdf8;
    border-radius: 18px;
    box-shadow: 0 6px 20px rgba(178, 92, 30, 0.12);
    padding: 20px;
    margin-top: 20px;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: #fffef9;
    border-radius: 16px;
    border: 3px solid #f3ddb0;
    width: 100%;
    max-width: 700px;
    height: auto;
    touch-action: none;
  }
  .controls { margin-top: 20px; }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .row label {
    min-width: 130px;
    font-weight: bold;
    font-size: 0.92em;
    color: #b25c1e;
  }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 10px;
    border-radius: 6px;
    background: linear-gradient(90deg, #ffd699, #ff9d4d);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid #e8792a;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  input[type="range"]::-moz-range-thumb {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid #e8792a;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .val {
    min-width: 52px;
    text-align: right;
    font-weight: bold;
    color: #d9670c;
  }
  .btnrow {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  button.toggle {
    background: linear-gradient(90deg, #e08a1e, #d9670c);
    color: #fff;
    font-weight: 800;
    padding: 14px 24px;
    border-radius: 14px;
    border: none;
    font-size: 1em;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(217, 103, 12, 0.35);
    transition: transform 0.12s ease;
  }
  button.toggle:active { transform: translateY(1px); }
  button.toggle.off {
    background: #f3ddb0;
    color: #b25c1e;
    box-shadow: none;
  }
  .readout {
    margin-top: 18px;
    background: #fff3da;
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 0.98em;
    line-height: 1.6;
  }
  .readout b { color: #b25c1e; }
  .force-label {
    text-align: center;
    font-size: 1.15em;
    font-weight: 800;
    margin-top: 8px;
  }
  .up { color: #3f8f4f; }
  .down { color: #c0392b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✈️ 베르누이 날개 실험실</h1>
  <p class="sub">바람 세기와 날개 곡률을 바꿔가며, 왜 날개가 뜨는지 직접 확인해보세요!</p>

  <div class="card">
    <canvas id="cv" width="700" height="420"></canvas>

    <div class="force-label" id="forceLabel">양력: 위로 뜨는 힘이 생기고 있어요 ⬆️</div>

    <div class="controls">
      <div class="row">
        <label for="speed">바람 세기</label>
        <input type="range" id="speed" min="1" max="10" step="1" value="5">
        <span class="val" id="speedVal">5</span>
      </div>
      <div class="row">
        <label for="camber">날개 곡률</label>
        <input type="range" id="camber" min="0" max="100" step="5" value="60">
        <span class="val" id="camberVal">60%</span>
      </div>
    </div>

    <div class="btnrow">
      <button class="toggle" id="flipBtn">🔄 날개 뒤집기 (자동차 스포일러 모드)</button>
    </div>

    <div class="readout" id="readout">
      위쪽 곡면 위를 지나는 빨간 점들이 아래쪽 파란 점들보다 <b>더 빨리</b> 움직이는 게 보이나요?
      베르누이 원리에 따르면 <b>빠르게 흐르는 공기는 압력이 낮아져요</b>. 그래서 날개 위쪽 압력이 아래쪽보다 낮아지고,
      압력이 높은 아래에서 낮은 위로 밀어 올리는 힘, 즉 <b>양력</b>이 생겨요.
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const speedSlider = document.getElementById('speed');
const camberSlider = document.getElementById('camber');
const speedVal = document.getElementById('speedVal');
const camberVal = document.getElementById('camberVal');
const flipBtn = document.getElementById('flipBtn');
const forceLabel = document.getElementById('forceLabel');
const readout = document.getElementById('readout');

let flipped = false;

function getParams() {
  return {
    speed: parseInt(speedSlider.value, 10),
    camber: parseInt(camberSlider.value, 10) / 100
  };
}

// airfoil geometry in canvas coords (centered)
const cx = W/2, cy = H/2 + 30;
const chord = 380;
const leftX = cx - chord/2;

function airfoilY(xFrac, camber, top, flip) {
  // xFrac in [0,1] along chord
  const s = Math.sin(Math.PI * xFrac);
  let upH = 70 * camber + 8;
  let loH = 14;
  let y;
  if (top) {
    y = -upH * Math.pow(s, 0.7);
  } else {
    y = loH * Math.pow(s, 0.9);
  }
  if (flip) y = -y;
  return y;
}

function drawAirfoil(camber, flip) {
  ctx.beginPath();
  const n = 60;
  for (let i = 0; i <= n; i++) {
    const xf = i / n;
    const x = leftX + xf * chord;
    const y = cy + airfoilY(xf, camber, true, flip);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  for (let i = n; i >= 0; i--) {
    const xf = i / n;
    const x = leftX + xf * chord;
    const y = cy + airfoilY(xf, camber, false, flip);
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = flip ? '#c0392b' : '#e8792a';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#b25c1e';
  ctx.stroke();
}

// particles
let topParticles = [];
let botParticles = [];
const LANES_TOP = 3;
const LANES_BOT = 2;

function initParticles() {
  topParticles = [];
  botParticles = [];
  for (let lane = 0; lane < LANES_TOP; lane++) {
    for (let k = 0; k < 5; k++) {
      topParticles.push({ x: -Math.random()*W, laneOffset: lane * 16 + 20 });
    }
  }
  for (let lane = 0; lane < LANES_BOT; lane++) {
    for (let k = 0; k < 5; k++) {
      botParticles.push({ x: -Math.random()*W, laneOffset: lane * 16 + 16 });
    }
  }
}
initParticles();

function step() {
  const { speed, camber } = getParams();
  ctx.clearRect(0, 0, W, H);

  // background guide lines
  ctx.strokeStyle = 'rgba(178,92,30,0.08)';
  ctx.lineWidth = 1;
  for (let gy = 40; gy < H; gy += 40) {
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();
  }

  const baseSpeed = 1.2 + speed * 0.55;
  const topSpeedMult = 1.6 + camber * 1.8; // faster over curved top
  const botSpeedMult = 1.0;

  drawAirfoil(camber, flipped);

  // top particles (fast, red)
  ctx.fillStyle = flipped ? '#3b82c4' : '#d9670c';
  topParticles.forEach(p => {
    p.x += baseSpeed * topSpeedMult;
    if (p.x > W + 20) p.x = -20;
    let y;
    if (p.x > leftX - 20 && p.x < leftX + chord + 20) {
      const xf = Math.min(1, Math.max(0, (p.x - leftX) / chord));
      y = cy + airfoilY(xf, camber, true, flipped) - p.laneOffset;
    } else {
      y = cy - (flipped ? -1 : 1) * p.laneOffset - (flipped ? 8*camber : 8*camber);
      y = cy + (flipped ? 1 : -1) * p.laneOffset;
    }
    ctx.beginPath();
    ctx.arc(p.x, y, 4, 0, Math.PI*2);
    ctx.fill();
  });

  // bottom particles (slow, blue)
  ctx.fillStyle = flipped ? '#d9670c' : '#3b82c4';
  botParticles.forEach(p => {
    p.x += baseSpeed * botSpeedMult;
    if (p.x > W + 20) p.x = -20;
    let y;
    if (p.x > leftX - 20 && p.x < leftX + chord + 20) {
      const xf = Math.min(1, Math.max(0, (p.x - leftX) / chord));
      y = cy + airfoilY(xf, camber, false, flipped) + p.laneOffset;
    } else {
      y = cy + p.laneOffset;
    }
    ctx.beginPath();
    ctx.arc(p.x, y, 4, 0, Math.PI*2);
    ctx.fill();
  });

  // force arrow
  const forceMag = 25 + (speed/10) * (camber) * 110;
  const arrowColor = flipped ? '#c0392b' : '#3f8f4f';
  const dir = flipped ? 1 : -1;
  ctx.strokeStyle = arrowColor;
  ctx.fillStyle = arrowColor;
  ctx.lineWidth = 5;
  const ax0 = cx, ay0 = cy;
  const ax1 = cx, ay1 = cy + dir * (40 + forceMag);
  ctx.beginPath();
  ctx.moveTo(ax0, ay0);
  ctx.lineTo(ax1, ay1);
  ctx.stroke();
  // arrowhead
  ctx.beginPath();
  const headLen = 14;
  ctx.moveTo(ax1, ay1);
  ctx.lineTo(ax1 - 8, ay1 - dir*headLen);
  ctx.lineTo(ax1 + 8, ay1 - dir*headLen);
  ctx.closePath();
  ctx.fill();

  // pressure labels
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = flipped ? '#3b82c4' : '#d9670c';
  ctx.textAlign = 'center';
  ctx.fillText(flipped ? '압력 높음' : '압력 낮음 (빠름)', cx, cy - 90 * (flipped?-1:1) - (flipped? -10:10));
  ctx.fillStyle = flipped ? '#d9670c' : '#3b82c4';
  ctx.fillText(flipped ? '압력 낮음 (빠름)' : '압력 높음', cx, cy + 90 * (flipped?-1:1) + (flipped? -10:10));

  requestAnimationFrame(step);
}

function updateLabels() {
  const { speed, camber } = getParams();
  speedVal.textContent = speed;
  camberVal.textContent = Math.round(camber*100) + '%';

  if (!flipped) {
    forceLabel.innerHTML = '양력: 위로 뜨는 힘이 생기고 있어요 <span class="up">⬆️ (비행기가 뜨는 원리)</span>';
    forceLabel.className = 'force-label up';
    readout.innerHTML = '위쪽 곡면 위를 지나는 점들이 아래쪽보다 <b>더 빨리</b> 움직이는 게 보이나요? ' +
      '베르누이 원리에 따르면 <b>빠르게 흐르는 공기는 압력이 낮아져요</b>. 그래서 날개 위쪽 압력이 아래쪽보다 낮아지고, ' +
      '압력이 높은 아래에서 낮은 위로 밀어 올리는 힘, 즉 <b>양력</b>이 생겨요. 바람을 세게 하거나 곡률을 키우면 양력 화살표가 더 길어지는 걸 확인해보세요!';
  } else {
    forceLabel.innerHTML = '다운포스: 땅으로 누르는 힘이 생기고 있어요 <span class="down">⬇️ (자동차 리어윙 원리)</span>';
    forceLabel.className = 'force-label down';
    readout.innerHTML = '날개를 뒤집으니 이번엔 <b>아래쪽</b>이 곡면이 되어서 공기가 더 빨리 흐르고, 압력이 낮아졌어요. ' +
      '그래서 힘이 <b>아래쪽</b>으로 생겨요. 이걸 <b>다운포스</b>라고 부르고, 자동차 뒷부분의 리어윙(스포일러)이 이 힘으로 ' +
      '차를 도로에 눌러줘서 빠른 속도에서도 잘 미끄러지지 않게 도와줘요. 실제 레이싱카·스포츠카에 쓰이는 진짜 기술이에요!';
  }
}

speedSlider.addEventListener('input', updateLabels);
camberSlider.addEventListener('input', updateLabels);
flipBtn.addEventListener('click', () => {
  flipped = !flipped;
  flipBtn.textContent = flipped ? '🔄 다시 비행기 날개로' : '🔄 날개 뒤집기 (자동차 스포일러 모드)';
  flipBtn.classList.toggle('off', flipped);
  updateLabels();
});

updateLabels();
requestAnimationFrame(step);
</script>
</body>
</html>
