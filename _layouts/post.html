---
layout: default
---
<div class="post-wrap">
  <a class="post-back" href="{{ '/' | relative_url }}">← 매티스토 목록으로</a>
  <header class="post-header">
    <div class="post-date">{{ page.date | date: "%Y년 %-m월 %-d일" }}</div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <div class="post-footer">
    <a class="post-back" href="{{ '/' | relative_url }}">← 다른 이야기도 보러가기</a>
  </div>
</div>
